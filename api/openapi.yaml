    createExport_request:
      properties:
        fields:
          description: Restrict columns. Omit for the full record.
          example:
          - id
          - title
          - price
          - address
          items:
            type: string
          type: array
          default: null
        filters:
          additionalProperties:
            nullable: true
          description: Same keys the list endpoint accepts.
          example:
            price_max: 60000000
            property_type: apartment
        format:
          description: Output format. Parquet is named in the schema and is not implemented;
            asking for it is refused rather than answered with a corrupt file.
          enum:
          - ndjson
          - csv
          example: ndjson
          type: string
      required:
      - format
    createGeneration_request:
      properties:
        kind:
          description: The transformation to apply. floorplan_render is named in the
            schema and is not implemented; asking for it is refused rather than answered
            with a fabricated plan.
          enum:
          - virtual_staging
          - decluttering
          - enhancement
          example: virtual_staging
          type: string
        prompt:
          description: "Up to 500 characters of additional direction. It is added\
            \ to the instruction for the chosen kind and never replaces it, so it\
            \ cannot be used to make the model do something unrelated."
          example: A bright Scandinavian living room with oak floors and a linen sofa
          type: string
        room_type:
          description: "For virtual_staging: what the room is. Improves the result\
            \ markedly. Defaults to a generic room."
          example: living room
          type: string
        source_image_id:
          description: "The image to transform. Must belong to one of your own properties;\
            \ anything else answers 404, the same as an image that does not exist."
          example: img_ce1c9e04db6140eda7c6934af60daebb
          type: string
        style:
          description: "For virtual_staging: the furnishing style. Defaults to contemporary."
          example: scandinavian
          type: string
      required:
      - kind
      - source_image_id
    createImportSource_request:
      properties:
        deletion_policy:
          default: explicit_only
          description: "explicit_only honours deletion markers alone. absence_withdraws\
            \ also withdraws anything missing from a full delivery, and should only\
            \ be used where the format is a complete statement of stock."
          enum:
          - explicit_only
          - absence_withdraws
          example: explicit_only
          type: string
        delivery:
          additionalProperties:
            nullable: true
          description: "How data arrives. fetch_url pulls from a URL you give us on\
            \ a schedule; api_push means you send us each delivery. SFTP drops are\
            \ named in the schema and are not running yet, so asking for one is refused\
            \ rather than answered with credentials for a host that would never accept\
            \ them."
          example:
            compression: gzip
            url: https://example.com/hooks/skautik
        format:
          description: Format this source delivers. Only csv and json parse today;
            the others are named in the schema and are refused here rather than accepted
            into a connector that would fail every run.
          enum:
          - csv
          - json
          example: csv
          type: string
        mapping:
          additionalProperties:
            nullable: true
          description: "Field mapping, for formats that need one. Omit for OpenImmo\
            \ and RESO, which are already standardised."
          example:
            Kaufpreis: price
            Objektnummer: external_id
            Wohnflaeche: living_area
        name:
          description: Your own label for the connector.
          example: Nightly listing sync
          type: string
        schedule:
          description: "How often to pull, for fetched sources. Cron expression in\
            \ UTC. Ignored for drops and pushes, which run on arrival."
          example: 15 3 * * *
          type: string
      required:
      - delivery
      - format
      - name
    createImport_request:
      properties:
        dry_run:
          default: false
          description: Validate and report what would change without writing anything.
            Run this first on any migration.
          example: false
          type: boolean
        file:
          description: The payload. Mutually exclusive with url.
          example: listings.csv
          format: binary
          type: string
        format:
          description: Which format the payload is in.
          enum:
          - openimmo
          - blm
          - kyero
          - csv
          - json
          example: openimmo
          type: string
        mode:
          default: incremental
          description: "incremental updates what the payload contains. full_sync additionally\
            \ withdraws anything absent, and is refused unless the source is configured\
            \ for it."
          enum:
          - incremental
          - full_sync
          example: incremental
          type: string
        source_id:
          description: Apply a stored import source's mapping and settings rather
            than the defaults.
          example: src_immoscout
          type: string
        url:
          description: Where to fetch the payload from. Mutually exclusive with file.
          example: https://example.com/hooks/skautik
          type: string
      required:
      - format
    updateInquiry_request:
      properties:
        status:
          description: The state to move it to.
          enum:
          - new
          - read
          - replied
          - closed
          - spam
          example: new
          type: string
      required:
      - status
    createProperty_request:
      properties:
        address:
          additionalProperties:
            nullable: true
          description: At minimum a city and country; more improves geocoding precision.
          example:
            city: Berlin
            country: DE
            postal_code: "10999"
            street: Oranienstrasse 12
        currency:
          description: ISO 4217 code.
          example: EUR
          type: string
        external_id:
          description: "Your identifier for this property. Optional, but set it if\
            \ the record might later arrive through an import: without one the import\
            \ has nothing to match on and creates a duplicate."
          example: AG-4471-0812
          type: string
        price:
          description: Amount in minor units.
          example: 48900000
          type: integer
        property_type:
          description: One of the supported property types.
          example: apartment
          type: string
        title:
          description: Headline for the listing.
          example: Top-floor apartment with a south-facing balcony
          type: string
        transaction_type:
          description: sale or rent.
          example: sale
          type: string
      required:
      - address
      - currency
      - price
      - property_type
      - title
      - transaction_type
    searchProperties_request:
      properties:
        bounds:
          additionalProperties:
            nullable: true
          description: "Rectangle with sw_lat, sw_lng, ne_lat, ne_lng. Mutually exclusive\
            \ with polygon."
          example:
            east: 13.4791
            north: 52.5401
            south: 52.4812
            west: 13.3702
        filters:
          additionalProperties:
            nullable: true
          description: Same keys the list endpoint accepts as query parameters.
          example:
            price_max: 60000000
            property_type: apartment
        limit:
          default: 50
          description: "Results to return, 1 to 200."
          example: 50
          type: integer
        polygon:
          description: "Closed ring of [longitude, latitude] pairs, GeoJSON order."
          example:
          - - 13.3702
            - 52.4812
          - - 13.4791
            - 52.4812
          - - 13.4791
            - 52.5401
          - - 13.3702
            - 52.5401
          - - 13.3702
            - 52.4812
          items:
            type: string
          type: array
          default: null
        query:
          description: Plain-language description of what is wanted.
          example: "\"quiet two bedroom near a park, needs a home office\""
          type: string
    uploadPropertyImage_request:
      properties:
        file:
          description: Image payload.
          example: listings.csv
          format: binary
          type: string
        position:
          description: Display order. The image at position 0 is the primary one.
          example: 1
          type: integer
      required:
      - file
    createWebhook_request:
      properties:
        events:
          description: Event names to subscribe to. Every name must be one of the
            events listed above; an unrecognised one is refused rather than silently
            never firing.
          example:
          - property.created
          - inquiry.created
          items:
            type: string
          type: array
          default: null
        url:
          description: HTTPS endpoint. Plain HTTP is rejected.
          example: https://example.com/hooks/skautik
          type: string
      required:
      - events
      - url
    updateWebhook_request:
      properties:
        active:
          description: False pauses deliveries; the registration and its secret survive.
          example: true
          type: boolean
        events:
          description: Replaces the whole subscription list rather than adding to
            it.
          example:
          - property.created
          - property.withdrawn
          items:
            type: string
          type: array
          default: null
        url:
          description: New HTTPS endpoint.
          example: https://example.com/hooks/skautik
          type: string
    Problem_errors_inner:
      properties:
        code:
          example: invalid
          type: string
        detail:
          example: Must be a positive whole number of minor units.
          type: string
        field:
          example: price
          type: string
  securitySchemes:
    apiKey:
      description: "An API key, sent as `Authorization: Bearer sk_live_…`. Keys are\
        \ created in the developer console and carry a fixed set of scopes; a call\
        \ whose key lacks the scope its endpoint requires is refused rather than partially\
        \ served."
      scheme: bearer
      type: http

