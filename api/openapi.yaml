openapi: 3.1.0
info:
  contact:
    name: Skautik
    url: https://skautik.com/developers/docs
  description: |-
    The Skautik partner API.

    Every endpoint is authenticated by an API key and gated on a per-resource
    scope, so a key issued for market analysis cannot read anyone's enquiries and a
    read-only key cannot withdraw a listing.

    Responses are enveloped: the payload is under `data`, and anything about the
    response rather than the resource is under `meta`. Failures are RFC 9457 problem
    documents carrying a stable `code` to branch on.

    Writes accept an `Idempotency-Key`, and replaying one returns the original
    response rather than repeating the work.

    This document is generated from the API's own route tree, so an endpoint that
    appears here exists and one that exists appears here.
  title: Skautik Partner API
  version: 1.0.0
servers:
- description: Production
  url: https://api.skautik.com/v1/api
security:
- apiKey: []
tags:
- description: "The catalogue, and your own inventory within it. Read endpoints span\
    \ everything we hold; write endpoints only ever touch records your organisation\
    \ published."
  name: Properties
- description: "Where we have coverage, how each market is subdivided, and the aggregate\
    \ statistics computed across it."
  name: Markets
- description: Move inventory in from whatever system already holds it. A one-off
    import handles a migration; an import source keeps a CRM and Skautik in step indefinitely.
  name: Imports
- description: "Subscribe to changes rather than polling for them. A webhook costs\
    \ nothing against your request quota, which makes it much cheaper than re-reading\
    \ a market on a timer."
  name: Webhooks
- description: "Bulk extracts for volumes that would be unreasonable to page through.\
    \ An export is asynchronous: you request one, we build it, and you fetch the file\
    \ when it is ready."
  name: Exports
- description: Endpoints about your key rather than about property.
  name: Account and status
- description: "Enquiries people have made about your properties, and the state you\
    \ have moved each one to. Scoped to the properties your organisation owns: an\
    \ enquiry belongs to whoever owns the property it is about."
  name: Inquiries
- description: "Transform a photograph you have already uploaded: stage an empty room,\
    \ remove clutter, or correct how a picture was taken. Each request is queued and\
    \ produced in the background."
  name: Image generations
paths:
  /exports:
    get:
      description: |-
        Recent exports for your organisation, newest first.

        Statuses only. Download links are not included here: minting one per row would sign a URL for every export you have ever made on a call you probably wanted statuses from. Fetch the export itself for a link.

        Requires the `exports:create` scope.
      operationId: listExports
      responses:
        "200":
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: List exports
      tags:
      - Exports
      x-accepts:
      - application/problem+json
    post:
      description: |-
        Queue a bulk extract of the catalogue.

        Accepts the same filters as the list endpoint. Returns immediately with a pending export; subscribe to export.completed rather than polling. Note that a narrowed field set may not round trip: feeding an export back into an import needs the columns an import requires, external_id and type among them, so omit fields for analysis rather than for a re-import.

        Requires the `exports:create` scope.
      operationId: createExport
      requestBody:
        content:
          application/json:
            example:
              fields:
              - external_id
              - price
              - living_area_sqm
              - address_city
              filters:
                city: Berlin
                status: active
              format: ndjson
            schema:
              $ref: "#/components/schemas/createExport_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                data:
                  created_at: 2026-08-12T10:04:00Z
                  format: ndjson
                  id: exp_74c0ab
                  status: pending
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Request an export
      tags:
      - Exports
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /exports/{export_id}:
    get:
      description: |-
        Status, and the download URL once it is ready.

        Download URLs are signed and expire one hour after issue, and are minted per request rather than stored, so ask again if one lapses. The file itself is kept for seven days; after that the export still appears in your history with no link, because the object has been swept.

        Requires the `exports:create` scope.
      operationId: getExport
      parameters:
      - description: Export identifier.
        example: exp_74c0ab
        explode: false
        in: path
        name: export_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  byte_size: 4821004
                  download_url: https://exports.skautik.com/exp_74c0ab.ndjson?sig=…
                  expires_at: 2026-08-12T11:12:00Z
                  format: ndjson
                  id: exp_74c0ab
                  record_count: 1284
                  status: completed
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Retrieve an export
      tags:
      - Exports
      x-accepts:
      - application/json
      - application/problem+json
  /generations:
    get:
      description: |-
        Recent requests for your organisation, newest first.

        Requires the `images:write` scope.
      operationId: listGenerations
      responses:
        "200":
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: List generations
      tags:
      - Image generations
      x-accepts:
      - application/problem+json
    post:
      description: |-
        Queue a transformation of one of your property images.

        Returns immediately with a queued generation. Poll the retrieve endpoint, or subscribe to a webhook, rather than holding the request open. The source image must already belong to one of your properties: there is no way to submit an arbitrary URL, which is deliberate.

        Requires the `images:write` scope.
      operationId: createGeneration
      requestBody:
        content:
          application/json:
            example:
              kind: virtual_staging
              room_type: living room
              source_image_id: img_ce1c9e04db6140eda7c6934af60daebb
              style: scandinavian
            schema:
              $ref: "#/components/schemas/createGeneration_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                data:
                  created_at: 2026-08-13T14:39:51Z
                  id: gen_41bd169388ff4bee8706b822e4def3c5
                  kind: virtual_staging
                  property_id: prop_f06bd367019344dd91b559046f8e0d4c
                  room_type: living room
                  source_image_id: img_ce1c9e04db6140eda7c6934af60daebb
                  status: queued
                  style: scandinavian
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The source image does not exist, or is not on one of your\
            \ properties. The two are indistinguishable on purpose."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Request a generation
      tags:
      - Image generations
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /generations/kinds:
    get:
      description: |-
        The transformations available, and what each does.

        Served from the same list the API validates against, so it cannot fall behind. It also names what is deliberately not available and why, which is more useful than an absence you have to infer.

        Requires the `images:write` scope.
      operationId: listGenerationKinds
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  kinds:
                  - description: "Furnish an empty room in a chosen style, leaving\
                      \ the architecture untouched."
                    kind: virtual_staging
                  - description: Remove personal clutter from a room without changing
                      the furniture or the fabric of the building.
                    kind: decluttering
                  - description: "Correct exposure, white balance, and straightness,\
                      \ without altering what the photograph shows."
                    kind: enhancement
                  not_available:
                  - kind: floorplan_render
                    reason: "Named in the schema and not implemented. Rendering a\
                      \ floor plan needs a provider we have not integrated, and a\
                      \ plausible but wrong plan of somebody's home is worse than\
                      \ none."
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: List what can be generated
      tags:
      - Image generations
      x-accepts:
      - application/json
      - application/problem+json
  /generations/{generation_id}:
    get:
      description: |-
        Status, and the image once it is ready.

        Moves through queued, running, and then completed or failed. A failed generation carries the reason, including when the model declined rather than errored: those are different problems and only one is worth retrying.

        Requires the `images:write` scope.
      operationId: getGeneration
      parameters:
      - description: Generation identifier.
        example: gen_5c1e9a2b3d
        explode: false
        in: path
        name: generation_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  created_at: 2026-08-13T14:39:51Z
                  finished_at: 2026-08-13T14:40:07Z
                  id: gen_41bd169388ff4bee8706b822e4def3c5
                  image_url: https://images.skautik.com/generations/…/41bd1693.jpg
                  kind: virtual_staging
                  property_id: prop_f06bd367019344dd91b559046f8e0d4c
                  room_type: living room
                  source_image_id: img_ce1c9e04db6140eda7c6934af60daebb
                  status: completed
                  style: scandinavian
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Retrieve a generation
      tags:
      - Image generations
      x-accepts:
      - application/json
      - application/problem+json
  /healthz:
    get:
      description: |-
        Unauthenticated liveness check.

        Served at the host root rather than under the versioned prefix, and answered without a key. Use it to tell an outage from a credential problem: a healthy host that refuses your calls is an authentication question, not an availability one.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
                version: 2026-08-01
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
      security: []
      summary: Service status
      tags:
      - Account and status
      x-accepts:
      - application/json
    servers:
    - description: "The host itself, outside the versioned API."
      url: https://api.skautik.com
  /import-sources:
    get:
      description: |-
        Every standing connector your organisation has configured.

        Credentials are never returned. A fetched source often holds the login for your own server in its URL, so the URL comes back with the password removed.

        Requires the `imports:write` scope.
      operationId: listImportSources
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - active: true
                  created_at: 2026-08-12T10:04:00Z
                  deletion_policy: explicit_only
                  delivery:
                    type: fetch_url
                    url: https://partner:***@feeds.example.com/stock.csv
                  format: csv
                  id: src_1d77a0
                  last_delivery_at: 2026-08-13T12:00:04Z
                  name: Head office CRM
                  next_expected_at: 2026-08-13T16:00:00Z
                  schedule: 0 */4 * * *
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: List import sources
      tags:
      - Imports
      x-accepts:
      - application/json
      - application/problem+json
    post:
      description: |-
        A standing connector that imports on a schedule.

        Configure once and stop thinking about it. A source holds the format, the delivery method, the field mapping, and the deletion policy, and every run against it produces an import you can inspect.

        Requires the `imports:write` scope.
      operationId: createImportSource
      requestBody:
        content:
          application/json:
            example:
              deletion_policy: explicit_only
              delivery:
                type: fetch_url
                url: https://feeds.example.com/stock.csv
              format: csv
              name: Head office CRM
              schedule: 0 */4 * * *
            schema:
              $ref: "#/components/schemas/createImportSource_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                data:
                  active: true
                  created_at: 2026-08-12T10:04:00Z
                  deletion_policy: explicit_only
                  delivery:
                    type: fetch_url
                    url: https://feeds.example.com/stock.csv
                  format: csv
                  id: src_1d77a0
                  name: Head office CRM
                  next_expected_at: 2026-08-12T12:00:00Z
                  schedule: 0 */4 * * *
              schema:
                $ref: "#/components/schemas/Envelope"
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Create an import source
      tags:
      - Imports
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /import-sources/{source_id}:
    delete:
      description: |-
        Stop importing from this connector.

        Deleting a source stops future runs. It does not withdraw the properties it created, which stay under your organisation until you withdraw them yourself.

        Requires the `imports:write` scope.
      operationId: deleteImportSource
      parameters:
      - description: Source identifier.
        example: src_immoscout
        explode: false
        in: path
        name: source_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Delete an import source
      tags:
      - Imports
      x-accepts:
      - application/problem+json
    get:
      description: |-
        Configuration and recent run health.

        Requires the `imports:write` scope.
      operationId: getImportSource
      parameters:
      - description: Source identifier.
        example: src_immoscout
        explode: false
        in: path
        name: source_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Retrieve an import source
      tags:
      - Imports
      x-accepts:
      - application/problem+json
    patch:
      description: |-
        Change the mapping, schedule, or deletion policy.

        Requires the `imports:write` scope.
      operationId: updateImportSource
      parameters:
      - description: Source identifier.
        example: src_immoscout
        explode: false
        in: path
        name: source_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: The request succeeded.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The API key is missing or not valid.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The key does not carry the scope this endpoint requires.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No such record, or one belonging to another organisation."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was understood and something in it is not acceptable.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The rate limit or the plan's monthly allowance is exhausted.
      summary: Update an import source
      tags:
      - Imports
      x-accepts:
      - application/problem+json
  /imports:
    get:
      description: |-
        Import history for your organisation.

        Requires the `imports:write` scope.
      operationId: listImports
      parameters:
      - description: Only imports produced by one source.
        example: src_immoscout
        explode: true
        in: query
        name: source_id
        required: false
        schema:
          type: string
        style: form
      - description: Filter by outcome.
        example: validating
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - validating
          - processing
