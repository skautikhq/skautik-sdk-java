  /properties:
    get:
      description: |-
        Page through the catalogue with filters.

        The workhorse read endpoint. Filters combine with AND. Anything omitted is unconstrained, so an unfiltered call returns the whole catalogue in cursor order.

        Requires the `properties:read` scope.
      operationId: listProperties
      parameters:
      - description: Market identifier from the markets endpoint.
        example: berlin-de
        explode: true
        in: query
        name: market
        required: false
        schema:
          type: string
        style: form
      - description: District within the market. Repeatable for a union.
        example:
        - kreuzberg
        explode: true
        in: query
        name: district
        required: false
        schema:
          items:
            type: string
          type: array
          default: null
        style: form
      - description: Restrict to sales or rentals.
        example: sale
        explode: true
        in: query
        name: transaction_type
        required: false
        schema:
          enum:
          - sale
          - rent
          type: string
        style: form
      - description: Repeatable for a union.
        example:
        - apartment
        explode: true
        in: query
        name: property_type
        required: false
        schema:
          items:
            enum:
            - apartment
            - house
            - studio
            - land
            - commercial
            type: string
          type: array
          default: null
        style: form
      - description: "Inclusive lower bound, in minor units."
        example: 25000000
        explode: true
        in: query
        name: price_min
        required: false
        schema:
          type: integer
        style: form
      - description: "Inclusive upper bound, in minor units."
        example: 75000000
        explode: true
        in: query
        name: price_max
        required: false
        schema:
          type: integer
        style: form
      - description: Inclusive lower bound on bedroom count.
        example: 2
        explode: true
        in: query
        name: bedrooms_min
        required: false
        schema:
          type: integer
        style: form
      - description: "Inclusive lower bound on living area, in square metres."
        example: 60
        explode: true
        in: query
        name: area_min
        required: false
        schema:
          type: number
        style: form
      - description: Defaults to active. Pass explicitly to include withdrawn records.
        example: active
        explode: true
        in: query
        name: status
        required: false
        schema:
          default: active
          enum:
          - active
          - under_offer
          - withdrawn
          - archived
          type: string
        style: form
      - description: RFC 3339 timestamp. The efficient way to keep a mirror in step
          without re-reading everything.
        example: 2026-08-01T00:00:00Z
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          type: string
        style: form
      - description: "Records per page, 1 to 200."
        example: 100
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: integer
        style: form
      - description: "Opaque pointer from the previous response. Omit for the first\
          \ page. Cursors are stable across inserts, so paging never skips or repeats\
          \ a record the way an offset does."
        example: eyJpZCI6IjhmMmEifQ
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: "Field to order by. Prefix with a minus for descending. Ties\
          \ break on id, so paging is deterministic."
        example: -listed_at
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -listed_at
          enum:
          - listed_at
          - -listed_at
          - price
          - -price
          - area
          - -area
          type: string
        style: form
      - description: Comma-separated list of fields to return. Trims payloads substantially
          when you only need a few.
        example:
        - id
        - title
        - price
        - address_city
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            type: string
          type: array
          default: null
        style: form
      - description: Comma-separated related resources to inline rather than fetch
          separately.
        example:
        - images
        - price_history
        explode: false
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - images
            - price_history
            - market
            type: string
          type: array
          default: null
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                - id: prop_8f2a41c9d0
                  type: apartment
                  title: Top-floor apartment with a south-facing balcony
                  description: "Altbau flat on a quiet side street, two minutes from\
                    \ Görlitzer Park."
                  listing:
                    transaction_type: sale
                    status: active
                    price: 429000
                    currency: EUR
                    price_per_sqm: 5797.3
                    published_at: 2026-07-28T09:12:00Z
                  size:
                    living_area_sqm: 74
                  rooms:
                    bedrooms: 2
                    bathrooms: 1
